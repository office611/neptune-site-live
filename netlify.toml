[build]
  publish = "website"
  functions = "netlify/functions"

[[redirects]]
  from = "/"
  to = "/welcome/index.html"
  status = 200
  force = true

# /whole-home shows the /melb page and its thank-you page (Stefan 2026-11-09). Old /whole-home is in drafts/whole-home-old.
[[redirects]]
  from = "/whole-home"
  to = "/melb/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/whole-home/"
  to = "/melb/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/whole-home/thank-you"
  to = "/melb/thank-you/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/whole-home/thank-you/"
  to = "/melb/thank-you/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/home"
  to = "/home/"
  status = 301

[[redirects]]
  from = "/replacement-filters"
  to = "/replacement-filters/"
  status = 301

[[redirects]]
  from = "/experts"
  to = "/experts/"
  status = 301

[[redirects]]
  from = "/melbourne"
  to = "/melbourne/"
  status = 301

[[redirects]]
  from = "/experts/thank-you"
  to = "/experts/thank-you/"
  status = 301

# Old /assessment URL — preserve any existing links, bookmarks or live ad traffic
[[redirects]]
  from = "/assessment/thank-you"
  to = "/experts/thank-you/"
  status = 301

[[redirects]]
  from = "/assessment/thank-you/"
  to = "/experts/thank-you/"
  status = 301

[[redirects]]
  from = "/assessment"
  to = "/experts/"
  status = 301

[[redirects]]
  from = "/assessment/"
  to = "/experts/"
  status = 301

[[headers]]
  for = "/assets/videos/hero/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
