/* Solo VSL player -- single centered video, same self-hosted pattern
   (poster, custom seek bar, hover/tap behaviour) as the testimonial
   cards on /melb, just sized up for one video instead of a grid. */
#watch-vsl { padding-block: var(--s-10); }
.solo-vsl-wrap {
  position: relative;
  max-width: 380px;
  margin: 28px auto 0;
  aspect-ratio: 9 / 16;
  border-radius: 16px;
  overflow: hidden;
  background: #0b1e3d;
  box-shadow: 0 20px 44px rgba(0,0,0,.35);
}
.solo-vsl-wrap video, .solo-vsl-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
.solo-vsl-wrap .testimonial-video { cursor: pointer; }
.solo-vsl-wrap .testimonial-seek-wrap {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 14px 10px 10px;
  background: linear-gradient(180deg, transparent, rgba(0,0,0,.55));
  z-index: 3;
}
.solo-vsl-wrap .testimonial-seek {
  position: relative; height: 16px; display: flex; align-items: center;
  cursor: pointer; touch-action: none;
}
.solo-vsl-wrap .testimonial-seek::before {
  content: ''; position: absolute; left: 0; right: 0; height: 4px;
  border-radius: 2px; background: rgba(255,255,255,.3);
}
.solo-vsl-wrap .testimonial-seek-fill {
  position: absolute; left: 0; top: 50%; transform: translateY(-50%);
  height: 4px; border-radius: 2px; background: #fff; width: 0%; pointer-events: none;
}
.solo-vsl-wrap .testimonial-seek-handle {
  position: absolute; top: 50%; left: 0%; width: 14px; height: 14px;
  border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.5);
  transform: translate(-50%, -50%); pointer-events: none;
}
.solo-vsl-wrap .testimonial-play-btn {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 64px; height: 64px; border-radius: 50%;
  background: rgba(19,35,63,.75); border: 2px solid rgba(255,255,255,.9);
  display: flex; align-items: center; justify-content: center; pointer-events: none;
}
.solo-vsl-wrap .testimonial-play-btn svg { width: 26px; height: 26px; margin-left: 3px; }
.solo-vsl-wrap.is-playing .testimonial-play-btn { display: none; }

<!-- ══════════════════════════════════════════════════════
     Self-hosted video player -- identical pattern to /melb's
     testimonials, scoped generically so it works for however many
     .video-autoplay-card elements are on the page (here, just one).
══════════════════════════════════════════════════════ -->
<script>
(function () {
  var cards = document.querySelectorAll('.video-autoplay-card');
  if (!cards.length) return;

  var canHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

  cards.forEach(function (card, index) {
    var video = card.querySelector('.testimonial-video');
    var seek = card.querySelector('.testimonial-seek');
    var seekFill = card.querySelector('.testimonial-seek-fill');
    var seekHandle = card.querySelector('.testimonial-seek-handle');
    if (!video || !video.dataset.src) return;
    var loaded = false;
    var hasEngaged = false;

    function ensureLoaded() {
      if (loaded) return;
      loaded = true;
      video.src = video.dataset.src;
    }

    video.addEventListener('play', function () { card.classList.add('is-playing'); });
    video.addEventListener('pause', function () { card.classList.remove('is-playing'); });

    if (seek && seekFill && seekHandle) {
      video.addEventListener('timeupdate', function () {
        if (!video.duration) return;
        var pct = (video.currentTime / video.duration) * 100;
        seekFill.style.width = pct + '%';
        seekHandle.style.left = pct + '%';
      });

      var dragging = false;
      function seekTo(clientX) {
        if (!video.duration) return;
        var rect = seek.getBoundingClientRect();
        var pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
        video.currentTime = pct * video.duration;
        seekFill.style.width = (pct * 100) + '%';
        seekHandle.style.left = (pct * 100) + '%';
      }
      seek.addEventListener('pointerdown', function (e) {
        dragging = true;
        hasEngaged = true;
        ensureLoaded();
        video.muted = false;
        video.loop = false;
        video.play().catch(function () {});
        seek.setPointerCapture(e.pointerId);
        seekTo(e.clientX);
        e.stopPropagation();
      });
      seek.addEventListener('pointermove', function (e) { if (dragging) seekTo(e.clientX); });
      seek.addEventListener('pointerup', function () { dragging = false; });
      seek.addEventListener('pointercancel', function () { dragging = false; });
      seek.addEventListener('click', function (e) { e.stopPropagation(); });
    }

    if (index < 2) setTimeout(ensureLoaded, index * 300);

    var preloadObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          ensureLoaded();
          preloadObserver.disconnect();
        }
      });
    }, { rootMargin: '1600px 0px' });
    preloadObserver.observe(card);

    if (canHover) {
      card.addEventListener('mouseenter', function () {
        if (hasEngaged) return;
        ensureLoaded();
        video.muted = true;
        video.loop = true;
        video.play().catch(function () {});
      });
      card.addEventListener('mouseleave', function () {
        if (!hasEngaged) video.pause();
      });
    }

    card.addEventListener('click', function () {
      if (!hasEngaged) {
        hasEngaged = true;
        ensureLoaded();
        video.muted = false;
        video.loop = false;
        video.play().catch(function () {});
      } else if (video.paused) {
        video.play().catch(function () {});
      } else {
        video.pause();
      }
    });
  });
})();
</script>
