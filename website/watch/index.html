<!-- WATCH PAGE (Stefan 2026-11-10): only linked from the booking texts (nurture), not from the site.

     Videos: /assets/videos/watch/<file>.mp4 (+ .jpg poster, <id>-t.jpg card thumbnail), cut from the Meta ad videos.
     Deep links work: /watch/#eczema opens that topic. INSTALLS below sets the counter. -->

<style>
:root {
  --navy: #0B1E3D; --navy-2: #13233f; --navy-3: #1b2f52; --accent: #4DA6FF;
  --white: #fff; --muted: rgba(255,255,255,.74); --line: rgba(255,255,255,.12);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; font-family: 'Poppins', system-ui, sans-serif; color: var(--white);
  background: radial-gradient(120% 60% at 50% 0%, #17325c 0%, var(--navy) 55%) fixed, var(--navy);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
.wrap { max-width: 980px; margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) 16px 40px; }

/* Header */
.top { display: flex; justify-content: center; padding: 6px 0 22px; }
.top img { height: 26px; width: auto; display: block; }
.intro { text-align: center; max-width: 560px; margin: 0 auto 22px; }
.intro h1 { font-size: clamp(1.75rem, 7.4vw, 2.7rem); font-weight: 800; line-height: 1.08; letter-spacing: -.02em; margin: 0 0 10px; text-wrap: balance; }
.intro h1 .pop { color: var(--accent); }
.intro p { margin: 0; color: var(--muted); font-size: .98rem; line-height: 1.5; text-wrap: balance; }

/* Topic cards */
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@media (min-width: 720px) { .grid { grid-template-columns: repeat(4, 1fr); gap: 16px; } }
.card {
  position: relative; display: block; width: 100%; padding: 0; border: 0; cursor: pointer; text-align: left;
  aspect-ratio: 3 / 4; border-radius: 18px; overflow: hidden; background: var(--navy-2);
  box-shadow: 0 10px 28px rgba(0,0,0,.28), inset 0 0 0 1px var(--line);
  transition: transform .18s ease, box-shadow .18s ease; -webkit-tap-highlight-color: transparent;
}
.card:active { transform: scale(.97); }
@media (hover: hover) { .card:hover { transform: translateY(-3px); box-shadow: 0 16px 36px rgba(0,0,0,.36), inset 0 0 0 1px rgba(77,166,255,.5); } }
.card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(7,15,30,0) 42%, rgba(7,15,30,.5) 64%, rgba(7,15,30,.92) 100%); }
.card .label { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 1; }
.card .name { display: block; font-weight: 700; font-size: clamp(.95rem, 4vw, 1.08rem); line-height: 1.2; text-wrap: balance; }
.card .play {
  position: absolute; top: 10px; right: 10px; z-index: 1; width: 34px; height: 34px; border-radius: 50%;
  background: var(--accent); display: grid; place-items: center; box-shadow: 0 4px 14px rgba(77,166,255,.45);
}
.card .play svg { width: 14px; height: 14px; margin-left: 2px; }
.card .seen {
  position: absolute; top: 10px; left: 10px; z-index: 1; display: none; align-items: center; gap: 4px;
  padding: 4px 9px; border-radius: 999px; background: rgba(7,15,30,.72); font-size: .68rem; font-weight: 600;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.card.is-seen .seen { display: inline-flex; }

/* Installed across Melbourne: counter + dealing photo fan */
.installs { text-align: center; margin-top: 44px; }
.installs .eyebrow { display: block; font-size: .74rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
.installs .big { font-size: clamp(2.6rem, 11vw, 3.8rem); font-weight: 800; line-height: 1; letter-spacing: -.02em; }
.installs .big small { font-size: .55em; vertical-align: 6px; }
.installs .sub { margin: 8px 0 0; color: var(--muted); font-size: .95rem; }

.fan { position: relative; height: clamp(240px, 64vw, 330px); margin: 26px auto 0; max-width: 560px; }
.fan figure { position: absolute; left: 50%; top: 50%; margin: 0; border-radius: 14px; overflow: hidden; background: var(--navy-2); box-shadow: 0 14px 34px rgba(0,0,0,.4); border: 3px solid rgba(255,255,255,.92); transition: opacity .4s ease; }
.fan img { display: block; width: 100%; height: 100%; object-fit: cover; }
.fan .f-c { width: clamp(150px, 40vw, 210px); height: clamp(200px, 53vw, 280px); transform: translate(-50%, -50%); z-index: 3; }
.fan .f-l { width: clamp(126px, 34vw, 178px); height: clamp(168px, 45vw, 236px); transform: translate(calc(-50% - clamp(104px, 28vw, 150px)), -46%) rotate(-7deg); z-index: 2; }
.fan .f-r { width: clamp(126px, 34vw, 178px); height: clamp(168px, 45vw, 236px); transform: translate(calc(-50% + clamp(104px, 28vw, 150px)), -46%) rotate(7deg); z-index: 2; }
.fan figure.is-out { opacity: 0; }
.fan figcaption { position: absolute; left: 6px; bottom: 6px; display: inline-flex; align-items: center; gap: 4px; padding: 4px 9px; border-radius: 999px; background: rgba(7,15,30,.78); font-size: .68rem; font-weight: 600; color: #fff; }

.foot { text-align: center; margin-top: 34px; color: var(--muted); font-size: .9rem; line-height: 1.55; }
.foot strong { color: var(--white); font-weight: 600; }
.foot .brand { display: block; margin-top: 10px; font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.5); }

/* Story player */
.player { position: fixed; inset: 0; z-index: 50; background: #000; display: none; }
.player.open { display: block; }
.player video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
/* Tall phone screens: fill the screen like a story (crops a little off the sides, captions stay in) */
@media (max-aspect-ratio: 10/16) and (max-width: 699px) { .player video { object-fit: cover; } }
@media (min-width: 700px) { .player video { left: 50%; width: min(100%, calc(100vh * 9 / 16)); transform: translateX(-50%); } }
.p-top { position: absolute; left: 0; right: 0; top: 0; z-index: 2; padding: max(10px, env(safe-area-inset-top)) 12px 26px; background: linear-gradient(180deg, rgba(0,0,0,.6), rgba(0,0,0,0)); }
.bar { height: 3px; border-radius: 3px; background: rgba(255,255,255,.3); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: #fff; }
.p-head { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; gap: 10px; }
.p-title { font-weight: 700; font-size: 1rem; text-shadow: 0 1px 8px rgba(0,0,0,.5); }
.p-close { width: 44px; height: 44px; margin: -6px -6px -6px 0; border: 0; border-radius: 50%; background: rgba(255,255,255,.14); display: grid; place-items: center; cursor: pointer; }
.p-close svg { width: 18px; height: 18px; }
.p-tap { position: absolute; inset: 0; z-index: 1; border: 0; background: transparent; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.p-icon { position: absolute; left: 50%; top: 50%; z-index: 1; width: 76px; height: 76px; margin: -38px 0 0 -38px; border-radius: 50%; background: rgba(0,0,0,.45); display: grid; place-items: center; opacity: 0; transition: opacity .2s; pointer-events: none; }
.p-icon.show { opacity: 1; }
.p-icon svg { width: 30px; height: 30px; }
.p-btn { border: 0; border-radius: 999px; padding: 12px 20px; font-weight: 600; font-size: .95rem; background: var(--accent); color: #05131F; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
.p-btn.ghost { background: rgba(255,255,255,.16); color: #fff; }
.p-sound { position: absolute; left: 50%; bottom: max(26px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 2; }
.p-sound[hidden] { display: none; }
.p-end { position: absolute; inset: 0; z-index: 3; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; background: rgba(7,15,30,.88); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); text-align: center; }
.p-end.show { display: flex; }
.p-end h2 { margin: 0; font-size: 1.35rem; font-weight: 800; }
.p-end .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 420px; }
.chip { border: 1px solid rgba(255,255,255,.28); background: rgba(255,255,255,.08); border-radius: 999px; padding: 10px 16px; font-weight: 600; font-size: .92rem; cursor: pointer; }
.chip:active { transform: scale(.97); }
body.locked { overflow: hidden; }
@media (prefers-reduced-motion: reduce) { .card, .chip, .fan figure { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><img src="/assets/logos/Neptune_Logo_White.png" alt="Neptune Filtration" width="97" height="26"></header>

  <section class="intro">
    <h1>What <span class="pop">Matters Most</span> To You?</h1>
    <p>Tap one to hear from Neptune customers, in their own words.</p>
  </section>

  <main class="grid" id="grid" aria-label="Customer videos by topic"></main>

  <section class="installs">
    <span class="eyebrow">Installed Right Across Melbourne</span>
    <div class="big"><span id="count">0</span><small>+</small></div>
    <p class="sub">whole home systems installed</p>
    <div class="fan" id="fan" aria-label="Recent installs">
      <figure class="f-l"><img alt="Neptune system installed at a Melbourne home"><figcaption></figcaption></figure>
      <figure class="f-c"><img alt="Neptune system installed at a Melbourne home"><figcaption></figcaption></figure>
      <figure class="f-r"><img alt="Neptune system installed at a Melbourne home"><figcaption></figcaption></figure>
    </div>
  </section>

  <footer class="foot">
    <strong>Your free water test is booked.</strong> We'll see you soon.
    <span class="brand">Neptune Filtration · Melbourne's whole home filtration specialists</span>
  </footer>
</div>

<div class="player" id="player" role="dialog" aria-modal="true" aria-label="Customer video">
  <video id="pv" playsinline preload="none"></video>
  <button class="p-tap" id="ptap" aria-label="Pause or play"></button>
  <div class="p-icon" id="picon" aria-hidden="true"></div>
  <div class="p-top">
    <div class="bar"><i id="pfill"></i></div>
    <div class="p-head"><span class="p-title" id="ptitle"></span>
      <button class="p-close" id="pclose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </div>
  <button class="p-btn ghost p-sound" id="psound" hidden>Tap for sound</button>
  <div class="p-end" id="pend">
    <h2>Watch another?</h2>
    <div class="chips" id="pchips"></div>
    <button class="p-btn ghost" id="pall">See all topics</button>
  </div>
</div>

<script>
(function () {
  // 16 topics, one video each. Order follows the survey: skin and hair first, then water, then the install and us.
  var TOPICS = [
    { id: 'eczema',           name: 'Eczema',                   f: 'eczema-1' },
    { id: 'dry-skin',         name: 'Dry skin',                 f: 'dry-skin-1' },
    { id: 'hair-scalp',       name: 'Hair loss & itchy scalp',  f: 'hair-scalp-1' },
    { id: 'softer',           name: 'Softer skin & hair',       f: 'softer-1' },
    { id: 'smell',            name: 'Chlorine smell',           f: 'smell-1' },
    { id: 'chlorine',         name: 'Chlorine in your water',   f: 'chlorine-1' },
    { id: 'drinking',         name: 'Drinking water',           f: 'drinking-1' },
    { id: 'bottled',          name: 'No more bottled water',    f: 'bottled-1' },
    { id: 'limescale',        name: 'Limescale',                f: 'limescale-1' },
    { id: 'limescale-doctor', name: 'Why a doctor chose it',    f: 'limescale-2' },
    { id: 'lead',             name: 'Lead',                     f: 'lead-1' },
    { id: 'melbourne',        name: "Melbourne's water",        f: 'melbourne-1' },
    { id: 'why-filter',       name: 'Why filter every tap',     f: 'why-filter-1' },
    { id: 'install',          name: 'Install day',              f: 'install-1' },
    { id: 'flareups',         name: 'Eczema flare-ups',         f: 'eczema-2' },
    { id: 'recommend',        name: 'Would they recommend us?', f: 'recommend-1' }
  ];
  var BASE = '/assets/videos/watch/';
  var PLAY = '<svg viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>';
  var PAUSE = '<svg viewBox="0 0 24 24" fill="#fff"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
  var seen = {};
  try { seen = JSON.parse(localStorage.getItem('neptune-watch-seen') || '{}'); } catch (e) {}
  var saveSeen = function () { try { localStorage.setItem('neptune-watch-seen', JSON.stringify(seen)); } catch (e) {} };

  // Cards
  var grid = document.getElementById('grid');
  TOPICS.forEach(function (t) {
    var b = document.createElement('button');
    b.className = 'card' + (seen[t.id] ? ' is-seen' : '');
    b.dataset.id = t.id;
    b.setAttribute('aria-label', t.name);
    b.innerHTML = '<img src="' + BASE + t.id + '-t.jpg" alt="" loading="lazy" decoding="async">' +
      '<span class="seen">&#10003; Watched</span><span class="play" aria-hidden="true">' + PLAY + '</span>' +
      '<span class="label"><span class="name">' + t.name + '</span></span>';
    b.addEventListener('click', function () { open(t.id, true); });
    grid.appendChild(b);
  });

  // Player
  var P = document.getElementById('player'), V = document.getElementById('pv');
  var fill = document.getElementById('pfill'), title = document.getElementById('ptitle');
  var icon = document.getElementById('picon'), soundBtn = document.getElementById('psound');
  var end = document.getElementById('pend'), chips = document.getElementById('pchips');
  var cur = null, raf = 0, iconT = 0;

  function flash(svg) { icon.innerHTML = svg; icon.classList.add('show'); clearTimeout(iconT); iconT = setTimeout(function () { icon.classList.remove('show'); }, 650); }
  function tick() {
    fill.style.width = V.duration ? (V.currentTime / V.duration * 100) + '%' : '0';
    raf = requestAnimationFrame(tick);
  }
  function open(id, fromTap) {
    var t = TOPICS.filter(function (x) { return x.id === id; })[0];
    if (!t) return;
    cur = t;
    title.textContent = t.name;
    end.classList.remove('show');
    P.classList.add('open'); document.body.classList.add('locked');
    if (location.hash !== '#' + id) history.pushState({ watch: id }, '', '#' + id);
    V.poster = BASE + t.f + '.jpg';
    V.src = BASE + t.f + '.mp4';
    // Sound is only allowed straight from a tap; a deep link starts muted with a "Tap for sound" button.
    V.muted = !fromTap;
    var pr = V.play();
    if (pr && pr.catch) pr.catch(function () { V.muted = true; soundBtn.hidden = false; V.play().catch(function () {}); });
    soundBtn.hidden = !!fromTap;
    cancelAnimationFrame(raf); tick();
    seen[id] = 1; saveSeen();
    var card = grid.querySelector('[data-id="' + id + '"]'); if (card) card.classList.add('is-seen');
    if (window.fbq) fbq('trackCustom', 'WatchVideo', { topic: id });
  }
  function close(fromHistory) {
    V.pause(); V.removeAttribute('src'); V.load();
    P.classList.remove('open'); document.body.classList.remove('locked'); end.classList.remove('show');
    cancelAnimationFrame(raf); cur = null;
    if (!fromHistory && location.hash) history.back();
  }
  function showEnd() {
    var others = TOPICS.filter(function (x) { return x.id !== cur.id && !seen[x.id]; });
    if (others.length < 3) others = TOPICS.filter(function (x) { return x.id !== cur.id; });
    chips.innerHTML = '';
    others.slice(0, 4).forEach(function (o) {
      var c = document.createElement('button'); c.className = 'chip'; c.textContent = o.name;
      c.addEventListener('click', function () { history.replaceState({ watch: o.id }, '', '#' + o.id); open(o.id, true); });
      chips.appendChild(c);
    });
    end.classList.add('show');
  }
  V.addEventListener('ended', showEnd);
  document.getElementById('ptap').addEventListener('click', function () {
    if (V.muted && !soundBtn.hidden) { V.muted = false; soundBtn.hidden = true; return; }
    if (V.paused) { V.play(); flash(PLAY); } else { V.pause(); flash(PAUSE); }
  });
  soundBtn.addEventListener('click', function (e) { e.stopPropagation(); V.muted = false; soundBtn.hidden = true; V.play(); });
  document.getElementById('pclose').addEventListener('click', function () { close(false); });
  document.getElementById('pall').addEventListener('click', function () { close(false); });
  document.addEventListener('keydown', function (e) { if (cur && e.key === 'Escape') close(false); });
  // Phone back button closes the player; a link like /watch/#eczema opens that topic.
  window.addEventListener('popstate', function () {
    var id = location.hash.slice(1);
    if (!id && cur) close(true); else if (id && (!cur || cur.id !== id)) open(id, false);
  });
  if (location.hash.length > 1) open(location.hash.slice(1), false);

  // ── Install counter: counts up to this number, shown as 1,000+ ──
  var INSTALLS = 1000;
  var count = document.getElementById('count'), counted = false;
  function runCount() {
    if (counted) return; counted = true;
    var t0 = null;
    function step(ts) {
      if (!t0) t0 = ts;
      var k = Math.min(1, (ts - t0) / 1800);
      count.textContent = Math.round(INSTALLS * (1 - Math.pow(1 - k, 3))).toLocaleString('en-AU');
      if (k < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (e, obs) { if (e[0].isIntersecting) { runCount(); obs.disconnect(); } }, { rootMargin: '0px 0px -60px' }).observe(count);
  } else runCount();

  // ── Install photo fan: deals the next 3 photos every few seconds while on screen ──
  var PHOTOS = [
    ['23', 'Epping'], ['38', 'Deer Park'], ['6', 'Narre Warren South'], ['45', 'Bundoora'],
    ['43', 'Deanside'], ['41', 'Middle Park'], ['install-21', 'Mill Park'], ['install-10', 'Williams Landing'],
    ['37', 'Keysborough'], ['49', 'Preston'], ['44', 'Williamstown'], ['42', 'Frankston']
  ];
  var src = function (n) { return '/assets/install-photos/' + n + '.jpg'; };
  var fan = document.getElementById('fan');
  var cards = [fan.querySelector('.f-c'), fan.querySelector('.f-l'), fan.querySelector('.f-r')];
  var at = 0, timer = null, onScreen = false;
  function show(animate) {
    cards.forEach(function (card, k) {
      var ph = PHOTOS[(at + k) % PHOTOS.length];
      var swap = function () { card.querySelector('img').src = src(ph[0]); card.querySelector('figcaption').textContent = ph[1]; };
      if (!animate) return swap();
      setTimeout(function () {
        card.classList.add('is-out');
        setTimeout(function () { swap(); card.classList.remove('is-out'); }, 420);
      }, k * 110);
    });
    for (var k = 0; k < 3; k++) new Image().src = src(PHOTOS[(at + 3 + k) % PHOTOS.length][0]);
  }
  function deal() { if (document.hidden) return; at = (at + 3) % PHOTOS.length; show(true); }
  function start() { clearInterval(timer); timer = onScreen ? setInterval(deal, 3200) : null; }
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (e) { onScreen = e[0].isIntersecting; start(); }).observe(fan);
  }
  show(false);
})();
</script>
</body>
</html>
